---
services:
  tailscale:
    container_name: tsmill
    hostname: tsmill
    image: tailscale/tailscale:latest
    volumes:
      - ~/services/tailscale/config:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      - sys_module
    environment:
      - PUID=1001
      - PGID=1001
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_HOSTNAME=${TS_HOSTNAME}
      - TS_USERSPACE=false
      - TS_AUTH_ONCE=false
      - TS_EXTRA_ARGS=${TS_EXTRA_ARGS:?set TS_EXTRA_ARGS in .env}
      - TS_STATE_DIR=/var/lib/tailscale
    # default CMD runs containerboot (tailscaled + tailscale up + TS_AUTHKEY). command: tailscaled alone → NeedsLogin forever
    networks:
      - docker_bridge
    # Ports for anything sharing this netns (tailnet-relay, unpackerr) MUST be declared
    # here, not on that service — network_mode: service:tailscale means they have no
    # netns of their own to publish from.
    # 25565/tcp = Minecraft Java, relayed below. This is the only raw-TCP service that
    # bypasses Caddy; Caddy has no layer4 plugin so it cannot terminate the MC protocol.
    ports:
      - 25565:25565/tcp
    depends_on:
      - headscale
    restart: always

  # TCP tsmill tailnet -> monster HOST tailnet IP (native Tailscale; Docker publishes ports on 0.0.0.0 there). Caddy: reverse_proxy http://tailscale:<listen_port>
  # Add more: socat tcp-listen:<L>,fork,reuseaddr tcp-connect:$${TAILNET_RELAY_TARGET}:<remote> &
  tailnet-relay:
    image: alpine/socat:latest
    container_name: tailnet_relay
    network_mode: service:tailscale
    env_file:
      - .env
    environment:
      TAILNET_RELAY_TARGET: ${HOMESERVER_TAILNET_IP:?set HOMESERVER_TAILNET_IP in .env}
      # Minecraft runs on the desktop, not the media host, so it needs its own target.
      MINECRAFT_RELAY_TARGET: ${MINECRAFT_TAILNET_IP:?set MINECRAFT_TAILNET_IP in .env}
    depends_on:
      - tailscale
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        socat tcp-listen:2284,fork,reuseaddr tcp-connect:$${TAILNET_RELAY_TARGET}:2283 &
        socat tcp-listen:2300,fork,reuseaddr tcp-connect:$${TAILNET_RELAY_TARGET}:3000 &
        socat tcp-listen:5055,fork,reuseaddr tcp-connect:$${TAILNET_RELAY_TARGET}:5055 &
        socat tcp-listen:8000,fork,reuseaddr tcp-connect:$${TAILNET_RELAY_TARGET}:8000 &
        socat tcp-listen:13378,fork,reuseaddr tcp-connect:$${TAILNET_RELAY_TARGET}:13378 &
        socat tcp-listen:25565,fork,reuseaddr tcp-connect:$${MINECRAFT_RELAY_TARGET}:25565 &
        wait
    restart: always

  # Jellyseerr replaced Ombi; it now runs on the media host (see compose.yml) and is
  # reached over the tailnet via the tailnet-relay above (listen 5055) + Caddy. Nothing
  # is published here anymore — this fixes the old Ombi-on-public-port-3579 exposure.

  headscale:
    image: headscale/headscale:v0.28.0  # Do not update willy nilly, you should check for breaking upgrades first
    container_name: headscale
    networks:
      - docker_bridge
    entrypoint: headscale serve
    labels:
      me.tale.headplane.target: headscale
    volumes:
      - ~/services/headscale:/etc/headscale
    environment:
      - PUID=1001
      - PGID=1001
    restart: always

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    env_file:
      - .env
    depends_on:
      - rutorrent
      - tailnet-relay
    volumes:
      - ~/services/caddy/Caddyfile:/etc/caddy/Caddyfile
      - ~/services/caddy/data:/data
      - ~/services/caddy/config:/config
    networks:
      - docker_bridge
    ports:
      - 80:80
      - 443:443
    restart: always

  # Shares tsmill netns so API calls to 100.x reach tailnet; plain docker_bridge has no route to 100.64.0.0/10.
  unpackerr:
    container_name: unpackerr
    image: "golift/unpackerr:latest"
    network_mode: service:tailscale
    volumes:
      - ~/services/unpackerr/config:/config
      - ~/services/rtorrent/downloads/complete:/downloads/complete
    environment:
      - PUID=1000
      - PGID=1000
    depends_on:
      - tailscale
    restart: always

  rutorrent:
    image: crazymax/rtorrent-rutorrent:latest
    container_name: rutorrent
    networks:
      - docker_bridge
    # Caddy reaches rutorrent:8000 / :8080 on docker_bridge; bind HTTP services to loopback only (no cleartext creds on WAN).
    # Caddyfile: handle /RPC2* { reverse_proxy http://rutorrent:8000 }; handle { reverse_proxy http://rutorrent:8080 }
    ports:
      - 6881:6881/tcp
      - 6881:6881/udp
      - 127.0.0.1:8000:8000
      - 127.0.0.1:8080:8080
      - 50000:50000/tcp
      - 50000:50000/udp
    env_file:
      - rtorrent-rutorrent.env
    volumes:
      - ~/services/rtorrent/data:/data
      - ~/services/rtorrent/downloads:/downloads
      - ~/services/rtorrent/passwd:/passwd
      - ~/services/rtorrent/log:/log
    restart: always

networks:
  docker_bridge:
    driver: bridge
