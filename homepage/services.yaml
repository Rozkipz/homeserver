# Service tiles — https://gethomepage.dev/configs/services/
# Internal links use monster's tailnet IP (MagicDNS short names don't resolve everywhere).
# `server`/`container` add a live docker status dot + CPU/RAM; `widget` pulls app stats through
# Docker DNS on the `internal` network. Keys come from HOMEPAGE_VAR_* env (see collect-keys.sh).
# Add external links here (any `href`) or as plain bookmarks in bookmarks.yaml.

- Media:
    - Plex:
        icon: plex.png
        href: http://100.64.0.3:32400/web
        description: Movies & TV
        server: monster
        container: plex
        # HTTPS on purpose: Plex runs with "Secure connections: Required", which silently
        # stalls plain HTTP from anything it doesn't consider local (Docker subnet included).
        # Homepage's proxy accepts Plex's self-signed *.plex.direct cert.
        widget:
          type: plex
          url: https://plex:32400
          key: "{{HOMEPAGE_VAR_PLEX_TOKEN}}"
    - Tautulli:
        icon: tautulli.png
        href: http://100.64.0.3:8181
        description: Plex stats & history
        server: monster
        container: tautulli
        widget:
          type: tautulli
          url: http://tautulli:8181
          key: "{{HOMEPAGE_VAR_TAUTULLI_KEY}}"
    - Jellyseerr:
        icon: jellyseerr.png
        href: http://100.64.0.3:5055
        description: Requests
        server: monster
        container: jellyseerr
