---
# Tailscale runs on the host OS (not Docker) so you can SSH to the machine on its tailnet IP.
# *arr: use Docker DNS (http://prowlarr:9696 etc.), not localhost.
services:
  archivebox:
    container_name: archivebox
    image: "archivebox/archivebox:latest"
    networks:
      - internal
    ports:
      - "8010:8000"
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - ~/services/archivebox/data/:/data/
    restart: always

  bazarr:
    container_name: bazarr
    image: "linuxserver/bazarr:latest"
    networks:
      - internal
    ports:
      - "6767:6767"
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - ~/services/bazarr/config:/config
      - /mnt/drive1/TV:/TV1
      - /mnt/drive1/Movies:/Movies1
      - /mnt/drive2/TV:/TV2
      - /mnt/drive2/Movies:/Movies2
      - /mnt/drive3/TV:/TV3
      - /mnt/drive3/Movies:/Movies3
      - /mnt/drive4/TV:/TV4
      - /mnt/drive4/Movies:/Movies4
      - /mnt/drive5/TV:/TV5
      - /mnt/drive5/Movies:/Movies5
      - /mnt/drive6/TV:/TV6
      - /mnt/drive6/Movies:/Movies6
      - /mnt/drive7/TV:/TV7
      - /mnt/drive7/Movies:/Movies7
      - /mnt/drive8/TV:/TV8
      - /mnt/drive8/Movies:/Movies8
      - /mnt/drive9/TV:/TV9
      - /mnt/drive9/Movies:/Movies9
      - /mnt/drive10/TV:/TV10
      - /mnt/drive10/Movies:/Movies10
      - /mnt/drive11/TV:/TV11
      - /mnt/drive11/Movies:/Movies11
    depends_on:
      - sonarr
      - radarr
    restart: always

  prowlarr:
    container_name: prowlarr
    image: "lscr.io/linuxserver/prowlarr:latest"
    networks:
      - internal
    ports:
      - "9696:9696"
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - ~/services/prowlarr/config:/config
    depends_on:
      - flaresolverr
    restart: always

  flaresolverr:
    container_name: flaresolverr
    image: "ghcr.io/flaresolverr/flaresolverr:latest"
    networks:
      - internal
    ports:
      - "8191:8191"
    environment:
      - PUID=1000
      - PGID=1000
    restart: always

  duplicati:
    container_name: duplicati
    image: "lscr.io/linuxserver/duplicati:latest"
    networks:
      - internal
    ports:
      - "8200:8200"
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - ~/services/duplicati/config:/config
      - ~/services/duplicati/restore:/restore
      - ~/services/duplicati/backups:/backups
      - ~/services/duplicati/source:/source
    restart: always


  plex:
    container_name: plex
    image: "linuxserver/plex:latest"
    networks:
      - internal
    ports:
      - 32400:32400
      - 1900:1900/udp
      - 5353:5353/udp
      - 8324:8324
      - 32410:32410/udp
      - 32412:32412/udp
      - 32413:32413/udp
      - 32414:32414/udp
      - 32469:32469
    environment:
      - PUID=1000
      - PGID=1000
      - VERSION=docker
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ~/services/plex/config:/config
      - ~/services/plex/transcode:/transcode
      - ~/services/plex/data:/data
      - /mnt/drive1/TV:/TV1
      - /mnt/drive1/Movies:/Movies1
      - /mnt/drive2/TV:/TV2
      - /mnt/drive2/Movies:/Movies2
      - /mnt/drive3/TV:/TV3
      - /mnt/drive3/Movies:/Movies3
      - /mnt/drive4/TV:/TV4
      - /mnt/drive4/Movies:/Movies4
      - /mnt/drive5/TV:/TV5
      - /mnt/drive5/Movies:/Movies5
      - /mnt/drive6/TV:/TV6
      - /mnt/drive6/Movies:/Movies6
      - /mnt/drive7/TV:/TV7
      - /mnt/drive7/Movies:/Movies7
      - /mnt/drive8/TV:/TV8
      - /mnt/drive8/Movies:/Movies8
      - /mnt/drive9/TV:/TV9
      - /mnt/drive9/Movies:/Movies9
      - /mnt/drive10/TV:/TV10
      - /mnt/drive10/Movies:/Movies10
      - /mnt/drive11/TV:/TV11
      - /mnt/drive11/Movies:/Movies11
    restart: always

  # Tautulli — Plex monitoring / watch history / stats. Tailnet-only on purpose: no Caddy vhost
  # and no tailnet-relay hop on the edge host, so reach it at http://<monster tailnet IP>:8181.
  # On `internal` so the setup wizard's Plex connection is http://plex:32400 (Docker DNS).
  # Plex logs mounted read-only so Tautulli can show them (Settings > Plex Media Server > Logs);
  # the path is where the LSIO plex image keeps them under /config.
  tautulli:
    container_name: tautulli
    image: lscr.io/linuxserver/tautulli:latest
    networks:
      - internal
    ports:
      - "8181:8181"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/London
    volumes:
      - ~/services/tautulli/config:/config
      - "~/services/plex/config/Library/Application Support/Plex Media Server/Logs:/logs:ro"
    depends_on:
      - plex
    restart: always

  radarr:
    container_name: radarr
    image: lscr.io/linuxserver/radarr:latest
    networks:
      - internal
    ports:
      - "7878:7878"
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - ~/services/radarr/config:/config
      - /mnt/drive1/Movies:/Movies1
      - /mnt/drive2/Movies:/Movies2
      - /mnt/drive3/Movies:/Movies3
      - /mnt/drive4/Movies:/Movies4
      - /mnt/drive5/Movies:/Movies5
      - /mnt/drive6/Movies:/Movies6
      - /mnt/drive7/Movies:/Movies7
      - /mnt/drive8/Movies:/Movies8
      - /mnt/drive9/Movies:/Movies9
      - /mnt/drive10/Movies:/Movies10
      - /mnt/drive11/Movies:/Movies11
      - /mnt/remote/:/downloads/complete
    depends_on:
      - prowlarr
    restart: always

  sonarr:
    container_name: sonarr
    image: lscr.io/linuxserver/sonarr:latest
    networks:
      - internal
    ports:
      - "8989:8989"
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - ~/services/sonarr/config:/config
      - /mnt/drive1/TV:/TV1
      - /mnt/drive2/TV:/TV2
      - /mnt/drive3/TV:/TV3
      - /mnt/drive4/TV:/TV4
      - /mnt/drive5/TV:/TV5
      - /mnt/drive6/TV:/TV6
      - /mnt/drive7/TV:/TV7
      - /mnt/drive8/TV:/TV8
      - /mnt/drive9/TV:/TV9
      - /mnt/drive10/TV:/TV10
      - /mnt/drive11/TV:/TV11
      - /mnt/remote/:/downloads/complete
    depends_on:
      - prowlarr
    restart: always

  # Jellyseerr — media-request frontend (replaces Ombi, which used to run on the edge host).
  # Lives here on `internal` so it reaches Plex/Sonarr/Radarr by Docker DNS
  # (http://plex:32400, http://sonarr:8989, http://radarr:7878) instead of over the tailnet.
  # Exposed publicly as jellyseerr.rowan.sh via the edge host's Caddy + tailnet-relay
  # (server-compose.yaml), so nothing is published on the public VPS. Port 5055 is bound here
  # only for the relay to reach over the tailnet. Not an LSIO image, so no PUID/PGID.
  jellyseerr:
    container_name: jellyseerr
    image: "fallenbagel/jellyseerr:latest"
    networks:
      - internal
    ports:
      - "5055:5055"
    environment:
      - TZ=UTC
      - LOG_LEVEL=info
    volumes:
      - ~/services/jellyseerr/config:/app/config
    restart: always

  # AudioBookRequest (markbeep/AudioBookRequest) — audiobook request manager.
  # On `internal` so it reaches Prowlarr by Docker DNS (http://prowlarr:9696) for searches.
  # Exposed as audiobookrequest.rowan.sh via the edge Caddy + tailnet-relay (server-compose.yaml,
  # socat 8000 hop). Port 8000 bound here only for the relay. Data/SQLite live in /config.
  # First run: create the root admin + pick login type in the UI. No PUID/PGID (not an LSIO image).
  audiobookrequest:
    container_name: audiobookrequest
    image: "markbeep/audiobookrequest:1"
    networks:
      - internal
    ports:
      - "8000:8000"
    environment:
      - ABR_APP__PORT=8000
    volumes:
      - ~/services/audiobookrequest/config:/config
    restart: always

  # Audiobookshelf — audiobook library + player. Reads audiobooks straight from the mill
  # (edge) download folder, which monster mounts at /mnt/remote over sshfs. AudioBookRequest
  # -> Prowlarr grabs into rtorrent's "audiobooks" category (complete/audiobooks on mill),
  # which surfaces here at /mnt/remote/audiobooks. Library mounted read-only so ABS can't
  # disturb the seeding torrents; its own data lives in /config + /metadata on local disk.
  # Exposed as audiobooks.rowan.sh via the edge Caddy + tailnet-relay (server-compose.yaml,
  # socat 13378 hop). Container listens on 80.
  audiobookshelf:
    container_name: audiobookshelf
    image: ghcr.io/advplyr/audiobookshelf:latest
    networks:
      - internal
    ports:
      - "13378:80"
    environment:
      - TZ=UTC
    volumes:
      - /mnt/remote/audiobooks:/audiobooks:ro
      - ~/services/audiobookshelf/config:/config
      - ~/services/audiobookshelf/metadata:/metadata
    restart: always

  # Audiobookshelf periodic scan. ABR triggers a scan at grab-time (too early — the torrent
  # is still downloading), and ABS's file-watcher can't see new files over the sshfs mount,
  # so completed audiobook downloads otherwise wouldn't be picked up until a manual scan.
  # This pings the ABS scan API every 10 min. ABS_API_KEY / ABS_LIBRARY_ID come from .env
  # (kept out of the repo). Same loop pattern as immich-backup.
  audiobookshelf-scan:
    image: alpine:3.20
    container_name: audiobookshelf_scan
    networks:
      - internal
    environment:
      ABS_API_KEY: ${ABS_API_KEY:?set ABS_API_KEY in .env}
      ABS_LIBRARY_ID: ${ABS_LIBRARY_ID:?set ABS_LIBRARY_ID in .env}
    command:
      - /bin/sh
      - -c
      - |
        until apk add --no-cache curl >/dev/null 2>&1; do
          echo "[abs-scan] installing curl (waiting for network)..."; sleep 10;
        done
        while true; do
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST -H "Authorization: Bearer $$ABS_API_KEY" "http://audiobookshelf:80/api/libraries/$$ABS_LIBRARY_ID/scan")
          echo "[abs-scan] $(date -u +%FT%TZ) scan -> $$code"
          sleep 600;
        done
    depends_on:
      - audiobookshelf
    restart: unless-stopped

  immich-server:
    image: ghcr.io/immich-app/immich-server:release
    container_name: immich_server
    networks:
      - immich_internal
    ports:
      - "2283:2283"
    depends_on:
      immich-redis:
        condition: service_healthy
      immich-database:
        condition: service_healthy
      immich-machine-learning:
        condition: service_started
    environment:
      TZ: UTC
      IMMICH_LOG_LEVEL: warn
      IMMICH_PUBLIC_URL: https://immich.rowan.sh
      DB_HOSTNAME: immich-database
      DB_USERNAME: immich
      DB_PASSWORD: immich
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: immich-redis
    volumes:
      # Live photo library lives on drive1 (mirrored to drive3 by immich-backup below).
      - /mnt/drive1/images:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:release
    container_name: immich_ml
    networks:
      - immich_internal
    volumes:
      - ~/services/immich/cache:/cache
    restart: unless-stopped

  immich-database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    container_name: immich_postgres
    networks:
      - immich_internal
    environment:
      POSTGRES_USER: immich
      POSTGRES_PASSWORD: immich
      POSTGRES_DB: immich
    volumes:
      - ~/services/immich/db:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U immich -d immich
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  immich-redis:
    image: docker.io/valkey/valkey:8@sha256:81db6d39e1bba3b3ff32bd3a1b19a6d69690f94a3954ec131277b9a26b95b3aa
    container_name: immich_redis
    networks:
      - immich_internal
    volumes:
      - ~/services/immich/redis:/data
    healthcheck:
      test: valkey-cli ping
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Redundancy: mirror the live Immich library (drive1) onto drive3 so the photos
  # (and Immich's daily DB dumps under backups/) exist on both 4TB drives.
  # Runs an initial sync on start, then every 6h. --delete keeps drive3 an exact
  # mirror; source is mounted read-only so this job can never modify the live library.
  immich-backup:
    image: alpine:3.20
    container_name: immich_backup
    networks:
      - internal
    command:
      - /bin/sh
      - -c
      - |
        until apk add --no-cache rsync >/dev/null 2>&1; do
          echo "[immich-backup] installing rsync (waiting for network)..."; sleep 10;
        done
        while true; do
          echo "[immich-backup] $(date -u +%FT%TZ) starting mirror drive1 -> drive3";
          if rsync -aH --delete /primary/ /backup/; then
            echo "[immich-backup] $(date -u +%FT%TZ) mirror complete";
          else
            echo "[immich-backup] $(date -u +%FT%TZ) mirror FAILED (rc=$?)";
          fi
          sleep 21600;
        done
    volumes:
      - /mnt/drive1/images:/primary:ro
      - /mnt/drive3/images:/backup
    restart: unless-stopped

  # Published on 0.0.0.0 so mill tailnet-relay can reach HOMESERVER_TAILNET_IP:3000 (host Tailscale + docker-proxy).
  # Headscale config dir: mkdir -p ~/services/headplane/headscale-ro && scp mill:~/services/headscale/config.yaml ~/services/headplane/headscale-ro/config.yaml
  headplane:
    image: ghcr.io/tale/headplane:latest
    container_name: headplane
    networks:
      - internal
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      HEADPLANE_SERVER__BASE_URL: ${HEADPLANE_BASE_URL:?set HEADPLANE_BASE_URL e.g. https://hs.rowan.sh}
      HEADPLANE_SERVER__COOKIE_SECRET: ${HEADPLANE_COOKIE_SECRET:?openssl rand -hex 16}
      HEADPLANE_HEADSCALE__URL: https://headscale.rowan.sh
      HEADPLANE_HEADSCALE__PUBLIC_URL: https://headscale.rowan.sh
    volumes:
      - ~/services/headplane/config.yaml:/etc/headplane/config.yaml
      - ~/services/headplane/data:/var/lib/headplane
      - ~/services/headplane/headscale-ro:/etc/headscale:ro
    restart: unless-stopped


  # Homepage (gethomepage.dev) — dashboard (replaced Heimdall, removed 2026-08-27). Tailnet-only: no Caddy vhost,
  # no relay hop; open http://<monster tailnet IP>/ (host port 80). Config is tracked in this repo under
  # homepage/ and copied to ~/services/homepage/config (see README). Tiles show container
  # status via the dockerproxy sidecar below and app stats via per-app API keys, passed in as
  # HOMEPAGE_VAR_* from .env — populate those with `sh homepage/collect-keys.sh` on the host.
  # Drives are mounted read-only only so the header can show per-drive usage.
  homepage:
    container_name: homepage
    image: ghcr.io/gethomepage/homepage:latest
    networks:
      - internal
    ports:
      - "80:3000"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/London
      # Host header allow-list (Homepage refuses other Host values). Port 80 = bare hostnames.
      - HOMEPAGE_ALLOWED_HOSTS=100.64.0.3,monster,monster.internal.rowan.sh,localhost
      - HOMEPAGE_VAR_PLEX_TOKEN=${HOMEPAGE_VAR_PLEX_TOKEN:?run homepage/collect-keys.sh on the host}
      - HOMEPAGE_VAR_TAUTULLI_KEY=${HOMEPAGE_VAR_TAUTULLI_KEY:?run homepage/collect-keys.sh on the host}
      - HOMEPAGE_VAR_JELLYSEERR_KEY=${HOMEPAGE_VAR_JELLYSEERR_KEY:?run homepage/collect-keys.sh on the host}
      - HOMEPAGE_VAR_ABS_KEY=${HOMEPAGE_VAR_ABS_KEY:?run homepage/collect-keys.sh on the host}
      - HOMEPAGE_VAR_SONARR_KEY=${HOMEPAGE_VAR_SONARR_KEY:?run homepage/collect-keys.sh on the host}
      - HOMEPAGE_VAR_RADARR_KEY=${HOMEPAGE_VAR_RADARR_KEY:?run homepage/collect-keys.sh on the host}
      - HOMEPAGE_VAR_PROWLARR_KEY=${HOMEPAGE_VAR_PROWLARR_KEY:?run homepage/collect-keys.sh on the host}
      - HOMEPAGE_VAR_BAZARR_KEY=${HOMEPAGE_VAR_BAZARR_KEY:?run homepage/collect-keys.sh on the host}
    volumes:
      - ~/services/homepage/config:/app/config
      - /mnt/drive1:/mnt/drive1:ro
      - /mnt/drive2:/mnt/drive2:ro
      - /mnt/drive3:/mnt/drive3:ro
      - /mnt/drive4:/mnt/drive4:ro
      - /mnt/drive5:/mnt/drive5:ro
      - /mnt/drive6:/mnt/drive6:ro
      - /mnt/drive7:/mnt/drive7:ro
      - /mnt/drive8:/mnt/drive8:ro
      - /mnt/drive9:/mnt/drive9:ro
      - /mnt/drive10:/mnt/drive10:ro
      - /mnt/drive11:/mnt/drive11:ro
    depends_on:
      - dockerproxy
    restart: always

  # Read-only view of the Docker API for Homepage (container list/status/stats only; POST
  # disabled). Keeps the raw socket out of the dashboard container. No published ports —
  # reachable only as http://dockerproxy:2375 on `internal`.
  dockerproxy:
    container_name: dockerproxy
    image: tecnativa/docker-socket-proxy:latest
    networks:
      - internal
    environment:
      - CONTAINERS=1
      - SERVICES=1
      - TASKS=1
      - POST=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: always

  # FileBrowser Quantum (gtsteffaniak fork) — web file manager, replaced filegator.
  # The original filebrowser/filebrowser is archived 2026-09-01 with ~10 unfixed
  # security advisories, so the maintained fork is used instead.
  # Not an LSIO image: it runs as its own `filebrowser` user, which is uid/gid 1000
  # and so already matches rowan on the host — no PUID/PGID needed.
  # Config + SQLite DB live in ~/services/filebrowser/data (the image points
  # FILEBROWSER_CONFIG / FILEBROWSER_DATABASE there). Sources are declared in that
  # config.yaml as container paths, which is why the drives mount under /srv/driveN.
  # NOTE: /srv/home exposes /home/rowan, which contains ~/homeserver/.env — drop
  # that last volume if you'd rather keep secrets out of the file manager.
  # First run: admin / admin. Change it immediately.
  filebrowser:
    container_name: filebrowser
    image: "gtstef/filebrowser:stable"
    networks:
      - internal
    ports:
      - "8088:80"
    environment:
      - TZ=UTC
    volumes:
      - ~/services/filebrowser/data:/home/filebrowser/data
      - /mnt/drive1:/srv/drive1
      - /mnt/drive2:/srv/drive2
      - /mnt/drive3:/srv/drive3
      - /mnt/drive4:/srv/drive4
      - /mnt/drive5:/srv/drive5
      - /mnt/drive6:/srv/drive6
      - /mnt/drive7:/srv/drive7
      - /mnt/drive8:/srv/drive8
      - /mnt/drive9:/srv/drive9
      - /mnt/drive10:/srv/drive10
      - /mnt/drive11:/srv/drive11
      - /home/rowan:/srv/home
    restart: always

networks:
  internal:
    driver: bridge
  immich_internal:
    driver: bridge
